name: pop-validate-linux
on:
  push:
    branches: [pop-validate]
jobs:
  liblogosdelivery-linux:
    runs-on: pop
    timeout-minutes: 60
    env:
      NPROC: 2
      MAKEFLAGS: ""
      NIMFLAGS: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: make liblogosdelivery
        run: make V=1 -j1 liblogosdelivery
      - name: Check liblogosdelivery exports no OpenSSL symbols
        run: scripts/check_lib_exports.sh build/liblogosdelivery.so
